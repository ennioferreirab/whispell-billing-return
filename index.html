<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; connect-src 'none'; frame-src 'none'; object-src 'none'">
  <title>Voltar ao Whispell</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 48px 24px; background: #f5f6f8; color: #14171f; font: 16px/1.6 system-ui, sans-serif; }
    main { max-width: 480px; margin: 8vh auto; padding: 32px; background: #fff; border: 1px solid #e4e7ec; border-radius: 16px; }
    h1 { margin: 0 0 16px; font-size: 28px; line-height: 1.2; }
    p { color: #3a4150; }
    a { display: inline-block; margin-top: 8px; padding: 12px 20px; border-radius: 8px; background: #14171f; color: #fff; text-decoration: none; }
    a:focus-visible { outline: 2px solid #2b44ff; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>Voltar ao Whispell</h1>
    <p>Esta página não confirma pagamento nem ativação do Coach. O aplicativo consulta o estado da sua conta ao retornar.</p>
    <a href="whispell://billing/return">Abrir Whispell</a>
    <p>Se o aplicativo não abrir, volte a ele e escolha Atualizar em Conta.</p>
  </main>
</body>
</html>
